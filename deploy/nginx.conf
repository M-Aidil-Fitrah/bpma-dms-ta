server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Batas keras infrastruktur (2 GiB). Superadmin hanya dapat memilih batas
    # aplikasi sampai nilai ini; perubahan di atasnya memerlukan rilis server.
    client_max_body_size 2048m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|ico|png|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
