server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Selaras dengan batas aplikasi saat ini (1 GiB). Penurunan limit perlu
    # dilakukan bersama validasi aplikasi agar pesan batas unggah tetap akurat.
    client_max_body_size 1024m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|ico|png|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
