; Deploy non-Docker untuk Debian/Ubuntu. Sesuaikan command php-fpm dan path
; project bila distribusi atau layout release berbeda.

[program:bpma-fpm]
command=/usr/sbin/php-fpm8.3 --nodaemonize
directory=/var/www/bpma-dms/current
user=www-data
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/bpma-fpm.log
stderr_logfile=/var/log/supervisor/bpma-fpm-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:bpma-queue-default]
command=/usr/bin/php artisan queue:work database --queue=default --sleep=1 --tries=2 --timeout=900 --max-time=3600
directory=/var/www/bpma-dms/current
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=1200
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/bpma-queue-default.log
stderr_logfile=/var/log/supervisor/bpma-queue-default-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:bpma-queue-thumbnail]
command=/usr/bin/php artisan queue:work database --queue=thumbnail --sleep=1 --tries=1 --timeout=180 --max-time=3600
directory=/var/www/bpma-dms/current
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=1200
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/bpma-queue-thumbnail.log
stderr_logfile=/var/log/supervisor/bpma-queue-thumbnail-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:bpma-scheduler]
command=/usr/bin/php artisan schedule:work
directory=/var/www/bpma-dms/current
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/bpma-scheduler.log
stderr_logfile=/var/log/supervisor/bpma-scheduler-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
