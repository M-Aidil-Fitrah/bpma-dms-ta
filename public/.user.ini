; Batas unggahan untuk lingkungan yang menjalankan PHP lewat FPM atau CGI —
; mencakup hampir seluruh hosting cPanel, Plesk, CyberPanel, aaPanel, dan VPS
; ber-nginx yang lazim.
;
; Berkas ini dibaca PHP dari direktori akar dokumen (`public/`), sehingga
; setelan di bawah berlaku begitu proyek di-deploy — tanpa akses root, tanpa
; menyunting php.ini, tanpa membuka panel apa pun.
;
; PENTING: nilainya harus selaras dengan `ukuran_tertinggi_kb` di
; `config/dms.php`. Superadmin dapat memilih batas aplikasi sampai nilai ini.
;
; Tidak berlaku pada:
;   - mod_php (Apache klasik)      -> diatur lewat public/.htaccess
;   - client_max_body_size nginx   -> wajib disetel di konfigurasi nginx
;
; Perubahan berkas ini disimpan PHP dalam cache selama `user_ini.cache_ttl`
; (bawaan 300 detik), jadi efeknya bisa tertunda beberapa menit.

upload_max_filesize = 2048M
post_max_size = 2098M

; Unggahan dialirkan ke berkas sementara di disk, bukan ditampung di memori,
; sehingga batas memori tidak perlu sebesar berkasnya.
memory_limit = 512M

; Unggahan besar pada koneksi lambat tidak boleh dipotong di tengah jalan.
max_execution_time = 0
max_input_time = 0
