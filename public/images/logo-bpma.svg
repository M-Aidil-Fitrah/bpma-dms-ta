<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER — TIMPA BERKAS INI DENGAN LOGO BPMA YANG SEBENARNYA.

  Ukuran asli logo: 638 x 168 px (rasio 3.798 : 1).
  Pertahankan `viewBox="0 0 638 168"` saat menimpa, supaya seluruh tata letak
  yang sudah menghitung rasio ini tidak perlu disesuaikan ulang.

  Ditaruh di `public/`, bukan di-import lewat Vite, supaya berkas ini bisa
  diganti kapan saja tanpa perlu build ulang — dan supaya build tidak gagal
  selama berkas aslinya belum tersedia.

  Komponen pemakai: resources/js/Components/ui/Logo.tsx
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 638 168" width="638" height="168"
     role="img" aria-label="BPMA">
  <title>BPMA</title>

  <!-- Marka: pengganti sementara untuk lambang daun/sayap pada logo asli. -->
  <g>
    <path d="M18 118 C 62 46, 130 26, 188 62 C 140 66, 104 88, 78 128 Z" fill="#1d3c8f"/>
    <path d="M40 130 C 84 72, 142 56, 192 78 C 148 88, 112 110, 90 140 Z" fill="#4caf50"/>
    <circle cx="176" cy="52" r="13" fill="#dc2626"/>
  </g>

  <!-- Wordmark sementara. -->
  <text x="228" y="118"
        font-family="Figtree, ui-sans-serif, system-ui, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-3" fill="#4caf50">bpma</text>
</svg>
